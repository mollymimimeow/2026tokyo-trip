<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 東京體驗聖誕節</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #0A192F; 
            --primary-color: #D32F2F; 
            --secondary-color: #388E3C; 
            --accent-gold: #FDD835; 
            --text-main: #E2E8F0; 
            --text-light: #94A3B8; 
            --card-bg: rgba(255, 255, 255, 0.05); 
            --card-border: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: calc(80px + var(--safe-bottom)); overflow-x: hidden; font-size: 14px; }
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; background-color: transparent; position: relative; }

        .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; background: radial-gradient(circle at 50% 0%, #1a2a6c, #112 70%); }
        .snow { position: absolute; top: -10%; color: white; font-size: 0.8em; text-shadow: 0 0 4px rgba(255,255,255,0.8); animation: fall linear infinite; opacity: 0; }
        @keyframes fall { 0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.5; } 100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; } }
        
        .header { background: linear-gradient(135deg, rgba(211, 47, 47, 0.9), rgba(183, 28, 28, 0.95)); color: white; padding: 45px 16px 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; text-align: center; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.5); z-index: 2; border-bottom: 2px solid var(--accent-gold); }
        .header::before { content: '✨ 🎄 🎁 🔔 ❄️'; position: absolute; top: 12px; left: 0; right: 0; font-size: 14px; letter-spacing: 16px; opacity: 0.6; animation: twinkle 3s infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.9; text-shadow: 0 0 8px var(--accent-gold); } }
        .header h1 { font-size: 22px; font-weight: 900; margin-bottom: 6px; letter-spacing: 1px; position: relative; z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.3), 0 0 12px rgba(253, 216, 53, 0.4); }
        .header p { font-size: 12px; opacity: 0.9; position: relative; z-index: 2; color: #FFCDD2; font-weight: 700; }
        .user-badge { position: absolute; top: 12px; right: 16px; z-index: 10; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 900; cursor: pointer; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); color: white; }

        .view-section { display: none; animation: fadeIn 0.2s ease; position: relative; z-index: 1; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .filter-container { display: flex; overflow-x: auto; gap: 8px; padding: 12px 16px 6px; scrollbar-width: none; }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn { background-color: rgba(255,255,255,0.1); color: var(--text-light); border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(4px); }
        .filter-btn.active { background-color: var(--primary-color); color: white; border-color: var(--accent-gold); box-shadow: 0 0 12px rgba(211, 47, 47, 0.4); }

        .date-tabs { display: flex; overflow-x: auto; gap: 10px; padding: 10px 16px 16px; scrollbar-width: none; }
        .date-tabs::-webkit-scrollbar { display: none; }
        .date-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 55px; height: 65px; background-color: rgba(255,255,255,0.05); border-radius: 12px; color: var(--text-light); cursor: pointer; transition: all 0.2s ease; border: 1px solid var(--card-border); backdrop-filter: blur(4px); }
        .date-tab span.day { font-size: 11px; margin-bottom: 2px; font-weight: 500; }
        .date-tab span.date { font-size: 18px; font-weight: 900; }
        .date-tab.active { background-color: var(--secondary-color); color: white; border-color: var(--accent-gold); transform: scale(1.05); box-shadow: 0 0 12px rgba(56, 142, 60, 0.4); }

        .itinerary-container { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
        
        .card { border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,0.3); position: relative; margin-bottom: 2px; display: flex; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-top: 1px solid rgba(255,255,255,0.2); }
        .drag-handle { width: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); cursor: grab; color: #64748B; font-size: 16px; border-right: 1px solid rgba(255,255,255,0.05); touch-action: none; }
        .drag-handle:active { cursor: grabbing; background: rgba(255,255,255,0.08); }
        
        .card-inner { flex-grow: 1; padding: 14px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 10; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; backdrop-filter: blur(4px); }
        .card-watermark { position: absolute; right: -5px; bottom: -10px; font-size: 80px; opacity: 0.15; z-index: 0; pointer-events: none; transform: rotate(-15deg); filter: drop-shadow(0 0 8px rgba(255,255,255,0.1)); }

        .theme-food { border-left: 4px solid #FF9800 !important; }
        .theme-food .time-badge { background: rgba(255, 152, 0, 0.2); color: #FFB74D; border: 1px solid rgba(255, 152, 0, 0.3);}
        .theme-attraction { border-left: 4px solid #4CAF50 !important; }
        .theme-attraction .time-badge { background: rgba(76, 175, 80, 0.2); color: #81C784; border: 1px solid rgba(76, 175, 80, 0.3);}
        .theme-transport { border-left: 4px solid #29B6F6 !important; }
        .theme-transport .time-badge { background: rgba(41, 182, 246, 0.2); color: #81D4FA; border: 1px solid rgba(41, 182, 246, 0.3);}
        .theme-hotel { border-left: 4px solid #BA68C8 !important; }
        .theme-hotel .time-badge { background: rgba(186, 104, 200, 0.2); color: #CE93D8; border: 1px solid rgba(186, 104, 200, 0.3);}
        .theme-shop { border-left: 4px solid #F06292 !important; }
        .theme-shop .time-badge { background: rgba(240, 98, 146, 0.2); color: #F48FB1; border: 1px solid rgba(240, 98, 146, 0.3);}
        .theme-default { border-left: 4px solid var(--primary-color) !important; }
        .theme-default .time-badge { background: rgba(211, 47, 47, 0.2); color: #EF5350; border: 1px solid rgba(211, 47, 47, 0.3);}

        .time-badge { font-size: 11px; padding: 4px 10px; border-radius: 10px; display: inline-block; font-weight: 900; margin-bottom: 8px; align-self: flex-start;}
        .card-title { font-size: 16px; font-weight: 900; margin-bottom: 8px; line-height: 1.4; color: white; padding-right: 50px; text-shadow: 0 2px 3px rgba(0,0,0,0.5); z-index: 1;}
        .card-note { padding: 0; font-size: 13px; color: #E2E8F0; line-height: 1.5; margin-bottom: 12px; z-index: 1;}
        .tag-pill { font-size: 11px; color: #FFF; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }
        .map-btn { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 900; margin-top: 4px; border: 1px solid rgba(255,255,255,0.2); z-index: 1;}
        .map-btn svg { width: 16px; height: 16px; margin-right: 6px; fill: var(--accent-gold); filter: drop-shadow(0 0 2px var(--accent-gold));}

        .fab { position: fixed; bottom: 85px; right: 16px; width: 52px; height: 52px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.6), 0 0 0 2px var(--accent-gold); cursor: pointer; z-index: 90; transition: transform 0.2s; }
        .fab::after { content: '🎁'; position: absolute; font-size: 24px; }
        .fab:active { transform: scale(0.9) rotate(10deg); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 100; backdrop-filter: blur(5px); padding-top: 40px; }
        .modal-box { background: #1E293B; padding: 20px; border-top-left-radius: 20px; border-top-right-radius: 20px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.1); color: white; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-box h3 { margin-bottom: 16px; font-weight: 900; color: white; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;}
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 900; color: #94A3B8; margin-bottom: 4px; }
        
        /* Auto-resizing textarea class */
        .auto-resize {
            field-sizing: content;
            min-height: 48px;
            max-height: 260px;
            overflow-y: auto;
            resize: none;
            box-sizing: border-box;
            line-height: 1.5;
            display: block;
            width: 100%;
        }
        
        .input-group input, .input-group textarea, .input-group select { 
            width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; 
            font-size: 13px; background: rgba(0,0,0,0.3); color: white; font-family: inherit; 
            box-sizing: border-box; -webkit-appearance: none; appearance: none;
        }
        input[type="time"] { min-height: 42px; text-align: center; }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { outline: 2px solid var(--accent-gold); }
        .checkbox-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: white; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; border:1px solid rgba(255,255,255,0.1); cursor:pointer;}
        .checkbox-item input { width: 16px; height: 16px; accent-color: var(--primary-color); cursor:pointer;}
        
        /* Custom styled multi-select tags */
        .tag-select-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-select-item { display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; user-select: none; }
        .tag-select-item input { display: none; }
        .tag-select-item:has(input:checked) { background: var(--primary-color); border-color: var(--accent-gold); box-shadow: 0 0 8px rgba(211, 47, 47, 0.4); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; position: sticky; bottom: 0; background: #1E293B; padding-top: 12px; padding-bottom: 8px; border-top: 1px solid rgba(255,255,255,0.1);}
        .btn-cancel { padding: 10px 16px; border: none; background: rgba(255,255,255,0.1); border-radius: 8px; color: white; font-weight: 900; cursor: pointer; flex: 1; font-size:13px;}
        .btn-save { padding: 10px 16px; border: none; background: var(--primary-color); border-radius: 8px; color: white; font-weight: 900; cursor: pointer; flex: 2; box-shadow: 0 4px 8px rgba(211,47,47,0.4); font-size:13px;}

        .identity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px;}
        .identity-btn { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 900; color: white; cursor: pointer; transition: 0.2s;}
        .identity-btn:active { background: var(--primary-color); border-color: var(--accent-gold); transform: scale(0.95);}

        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding: 10px 8px var(--safe-bottom); z-index: 50; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748B; font-size: 10px; font-weight: 900; gap: 4px; cursor: pointer; transition: 0.3s; flex: 1; padding: 4px 0; text-align: center; }
        .nav-item.active { color: var(--accent-gold); text-shadow: 0 0 8px rgba(253, 216, 53, 0.5); }
        .nav-icon { font-size: 20px; transition: transform 0.2s; filter: grayscale(100%) opacity(0.5);}
        .nav-item.active .nav-icon { transform: translateY(-2px) scale(1.1); filter: grayscale(0%) opacity(1);}
        
        .list-tabs { display: flex; padding: 16px 16px 0; gap: 8px; }
        .list-tab-btn { flex: 1; padding: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 13px; font-weight: 900; color: var(--text-light); cursor: pointer;}
        .list-tab-btn.active { background: var(--secondary-color); color: white; border-color: var(--accent-gold);}
        .sub-view { display: none; padding: 16px; animation: fadeIn 0.2s ease; }
        .sub-view.active { display: block; }
        #loading { text-align: center; padding: 30px; color: white; font-weight: 700; line-height: 1.6; font-size:13px;}
        .private-banner { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #E2E8F0; padding:10px; border-radius:10px; font-size:12px; font-weight:900; margin-bottom:12px; display: flex; align-items: center; gap: 6px; }
        [data-netlify-deploy-id], #netlify-drawer, .netlify-badge { display: none !important; }
        
        .flight-card { background: rgba(255,255,255,0.05); border-radius: 16px; position: relative; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 20px; box-shadow: 0 6px 16px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .flight-card-header { background: rgba(0,0,0,0.5); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.2);}
        .flight-card-body { padding: 16px; position: relative; }
        .flight-route { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; position: relative;}
        .flight-route::after { content: ''; position: absolute; left: 50px; right: 50px; top: 18px; border-top: 2px dashed rgba(255,255,255,0.2); z-index: 0; }
        .plane-icon { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); background: #1E293B; padding: 0 8px; z-index: 1; font-size: 16px;}
        .flight-port { text-align: center; z-index: 1; background: #1E293B; padding: 0 4px;}
        .flight-port h2 { font-size: 26px; font-weight: 900; color: var(--accent-gold); margin-bottom: 2px; line-height: 1;}
        .flight-port p { font-size: 11px; color: var(--text-light); font-weight: 900;}
        .flight-info-row { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: 10px; margin-bottom: 10px;}
        .flight-info-col { display: flex; flex-direction: column; flex: 1;}
        .flight-info-col label { font-size: 10px; color: var(--text-light); margin-bottom: 2px; font-weight: 700;}
        .flight-info-col span { font-size: 13px; font-weight: 900; color: white; }
        
        .add-btn-large { width: 100%; padding: 12px; background: var(--secondary-color); color: white; border: 1px solid var(--accent-gold); border-radius: 10px; font-size: 13px; font-weight: 900; margin-bottom: 16px; cursor: pointer; box-shadow: 0 4px 8px rgba(56, 142, 60, 0.3); display: flex; justify-content: center; align-items: center; gap: 6px; }
        .item-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: flex-start; gap: 10px; }
        .item-checkbox { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--secondary-color); flex-shrink: 0; }
        .item-title { font-size: 14px; font-weight: 700; color: white; margin-bottom: 4px; }
        .item-title.done { text-decoration: line-through; color: #64748B; }
        .category-header h3 { font-size: 15px; font-weight: 900; color: var(--accent-gold); }
    </style>
</head>
<body>

    <div class="snow-container" id="snow-container"></div>

    <div class="app-container">
        <div class="header">
            <div id="user-badge" class="user-badge" onclick="showIdentityModal()">切換使用者</div>
            <h1>2026 東京體驗聖誕節</h1>
            <p>Tokyo Christmas Trip 🎄</p>
        </div>

        <!-- ================= 行程表區塊 ================= -->
        <div id="view-itinerary" class="view-section active">
            <div class="filter-container" id="filter-container"></div>
            <div class="date-tabs" id="date-tabs"></div>
            <div id="loading">✨ 聖誕魔法連線中...</div>
            <div class="itinerary-container" id="itinerary-container"></div>
            <div id="fab-add" class="fab" onclick="openItineraryModal()"></div>
        </div>

        <!-- ================= 航班/飯店區塊 ================= -->
        <div id="view-flights" class="view-section">
            <div class="list-tabs">
                <button class="list-tab-btn active" onclick="switchSubView('view-flights', 'flights-list', this)">✈️ 航班資訊</button>
                <button class="list-tab-btn" onclick="switchSubView('view-flights', 'hotels-list', this)">🏨 飯店資訊</button>
            </div>
            <div id="sub-flights-list" class="sub-view active" style="padding-top:0;">
                <div class="filter-container" id="flight-filter-container" style="padding: 12px 16px 6px;"></div>
                <div class="flights-container" id="flights-ticket-container" style="padding-top: 8px;"></div>
            </div>
            <div id="sub-hotels-list" class="sub-view">
                <div class="private-banner">🏨 全員共用的飯店清單</div>
                <div class="fab" onclick="openHotelModal()"></div>
                <div class="flights-container" id="hotel-info-container"></div>
            </div>
        </div>

        <!-- ================= 購買清單 ================= -->
        <div id="view-shopping" class="view-section">
            <div style="padding:16px;">
                <div class="private-banner">🎁 這是你的私人聖誕購物願望清單</div>
                <div class="fab" onclick="addCategory('shop', '輸入分類名稱')"></div>
                <div id="shopping-list-container"></div>
            </div>
        </div>

        <!-- ================= 待辦/行李清單 ================= -->
        <div id="view-todo" class="view-section">
            <div class="list-tabs">
                <button class="list-tab-btn active" onclick="switchSubView('view-todo', 'todo', this)">📝 待辦事項</button>
                <button class="list-tab-btn" onclick="switchSubView('view-todo', 'luggage', this)">🧳 行李清單</button>
            </div>
            <div id="sub-todo" class="sub-view active">
                <div class="private-banner">📝 這是你的私人待辦事項（已加密儲存於雪地雲端）</div>
                <div class="fab" onclick="openTodoModal()"></div>
                <div id="todo-container"></div>
            </div>
            <div id="sub-luggage" class="sub-view">
                <div class="private-banner">🧳 這是你的私人行李清單</div>
                <div class="fab" onclick="addCategory('lug', '輸入行李分類')"></div>
                <div id="luggage-container"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchView('itinerary', this)"><span class="nav-icon">🎄</span><span>聖誕行程</span></div>
            <div class="nav-item" onclick="switchView('flights', this)"><span class="nav-icon">🦌</span><span>航班/住宿</span></div>
            <div class="nav-item" onclick="switchView('todo', this)"><span class="nav-icon">🧦</span><span>待辦/行李</span></div>
            <div class="nav-item" onclick="switchView('shopping', this)"><span class="nav-icon">🎁</span><span>聖誕禮物</span></div>
        </div>
    </div>

    <!-- ================= 模態框區塊 ================= -->
    
    <div class="modal-overlay" id="identity-modal">
        <div class="modal-box">
            <h3>🎅 歡迎！請問你是哪位旅伴？</h3>
            <p style="font-size:12px; color:var(--text-light); margin-bottom:10px;">系統將為你掛上專屬的聖誕襪與行程。</p>
            <div class="identity-grid" id="identity-grid"></div>

                let row = globalItinerary[key];
                if (row.date === currentDate) {
                    let match = false;
                    if (currentFilter === 'all') match = true; else if (row.pax && row.pax.includes(currentFilter)) match = true;
                    if (match) { row.id = key; dailyItems.push(row); }
                }
            }

            dailyItems.sort((a, b) => {
                let orderA = a.order !== undefined ? a.order : 9999; let orderB = b.order !== undefined ? b.order : 9999;
                if (orderA !== orderB) return orderA - orderB;
                let tA = parseInt((a.startTime||'99:99').replace(':','')); let tB = parseInt((b.startTime||'99:99').replace(':',''));
                return (tA || 9999) - (tB || 9999);
            });

            if (dailyItems.length === 0) { container.innerHTML = '<div style="text-align:center; padding: 40px; color:white; font-weight:900; opacity:0.5; font-size:13px;">此日無行程 ❄️</div>'; initSortable(); return; }

            dailyItems.forEach(row => {
                let themeClass = 'theme-default'; let watermark = '🎁'; let tStr = row.tag || '';
                if (tStr.includes('吃') || tStr.includes('餐')) { themeClass = 'theme-food'; watermark = '🍗'; }
                else if (tStr.includes('逛') || tStr.includes('買') || tStr.includes('購物')) { themeClass = 'theme-shop'; watermark = '🛍️'; }
                else if (tStr.includes('景點') || tStr.includes('遊') || tStr.includes('看')) { themeClass = 'theme-attraction'; watermark = '🎄'; }
                else if (tStr.includes('交通') || tStr.includes('機') || tStr.includes('其他')) { themeClass = 'theme-transport'; watermark = '🛷'; }
                else if (tStr.includes('住') || tStr.includes('退房')) { themeClass = 'theme-hotel'; watermark = '🔔'; }

                let timeParts = [];
                if(row.period) timeParts.push(row.period);
                if(row.startTime && row.endTime) timeParts.push(`${row.startTime} - ${row.endTime}`); else if(row.startTime) timeParts.push(row.startTime);
                let timeHtml = timeParts.length > 0 ? `<div class="time-badge">🕒 ${timeParts.join(' ')}</div>` : '';
                
                // 行程內容(原本的 notes) 改放在外面顯示
                let notesContent = row.notes ? `<div class="card-note">${row.notes.replace(/\n/g, '<br>')}</div>` : '';
                
                // 細項與筆記(原本的 traffic) 放裡面
                let detailsContent = '';
                if (row.traffic) detailsContent += `<p style="color:#FFF; margin-bottom:6px;"><strong>🛷 細項與筆記：</strong><br><span style="color:#94A3B8;">${row.traffic.replace(/\n/g, '<br>')}</span></p>`;
                let activeLinks = row.customLinks || [];
                if (!row.customLinks && row.links) {
                    let lines = row.links.split('\n').filter(l => l.trim());
                    lines.forEach(line => {
                        let m = line.match(/(https?:\/\/[^\s]+)/);
                        if (m) {
                            let u = m[1];
                            let t = line.replace(u, '').replace(/[:：🔗]/g, '').trim();
                            activeLinks.push({ title: t || '官方連結', url: u });
                        }
                    });
                }
                if (activeLinks.length > 0) {
                    let linksHtml = activeLinks.map(item => {
                        let u = item.url;
                        if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
                        return `<a href="${u}" target="_blank" style="color:var(--accent-gold); text-decoration:none; display:inline-flex; align-items:center; gap:4px; background:rgba(253,216,53,0.1); border:1px solid rgba(253,216,53,0.3); padding:4px 10px; border-radius:8px; font-size:12px; margin-right:8px; margin-top:6px; font-weight:700;">🔗 ${item.title}</a>`;
                    }).join('');
                    detailsContent += `<div style="margin-top:6px;"><strong style="color:#FFF; display:block; font-size:12px;">🔗 相關連結：</strong><div style="display:flex; flex-wrap:wrap;">${linksHtml}</div></div>`;
                }
                
                let detailsHtml = '';
                if (detailsContent) {
                    detailsHtml = `

                            <span style="font-size:12px;">📋 查看詳細資訊 (筆記 / 連結)</span><span style="font-size:14px;">▾</span>
                        </button>
                        <div class="details-box" style="display:none; background:rgba(0,0,0,0.3); padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.5; color:#CBD0E1; border:1px solid rgba(255,255,255,0.05); margin-bottom:10px;">
                            ${detailsContent}
                        </div>`;
                }
                
                let paxHtml = row.pax && row.pax.length > 0 ? `<span class="tag-pill" style="background:rgba(211, 47, 47, 0.4); border-color:rgba(211,47,47,0.8);">🎅 ${row.pax.join(', ')}</span>` : '';
                let tagsHtml = '';
                if (row.tag) {
                    let tagsArr = row.tag.split(',').map(s=>s.trim()).filter(s=>s);
                    tagsArr.forEach(tag => { tagsHtml += `<span class="tag-pill">${tag}</span>`; });
                }
                
                let paxAndTagHtml = (paxHtml || tagsHtml) ? `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; align-items:center;">${paxHtml}${tagsHtml}</div>` : '';
                let mapHtml = row.mapUrl ? `<a href="${row.mapUrl}" target="_blank" class="map-btn"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> 聖誕地圖導航</a>` : '';
                let dragHtml = currentFilter === 'all' ? `<div class="drag-handle">⋮⋮</div>` : '';

                let card = document.createElement('div');
                card.className = `card ${themeClass}`; card.dataset.id = row.id;
                
                card.innerHTML = `
                    ${dragHtml}
                    <div class="card-inner">
                        <div class="card-actions"><div class="icon-btn" onclick="editItinerary('${row.id}')">✏️</div><div class="icon-btn" onclick="delItinerary('${row.id}')">🗑️</div></div>

                            ${timeHtml}

                            ${paxAndTagHtml}
                            ${mapHtml}
                        </div>
                        <div class="card-watermark">${watermark}</div>
                    </div>`;
                container.appendChild(card);
            });

            // 顯示當日飯店與導航
            let showOvernight = false;
            if (currentFilter === 'all') showOvernight = true;
            else {
                let stay = MEMBER_STAY_RANGE[currentFilter];
                if (stay && currentDate >= stay.start && currentDate < stay.end) showOvernight = true;
            }

            if (showOvernight) {
                let hName = null;
                let hMap = "";
                
                // 動態比對全域的 allHotelsData 日期區間
                for (let k in allHotelsData) {
                    let h = allHotelsData[k];
                    if (h.date) {
                        let parts = h.date.split('-').map(s => s.trim());
                        if (parts.length === 2) {
                            if (currentDate >= parts[0] && currentDate < parts[1]) { hName = h.name; hMap = h.mapUrl || ''; break; }
                        } else if (parts.length === 1) {
                            if (currentDate === parts[0]) { hName = h.name; hMap = h.mapUrl || ''; break; }
                        }
                    }
                }
                
                // 備用機制：若找不到則比對預設常數
                if (!hName && OVERNIGHT_SCHEDULE[currentDate]) {
                    hName = OVERNIGHT_SCHEDULE[currentDate];
                    for (let k in allHotelsData) {
                        if (allHotelsData[k].name.includes(hName) || hName.includes(allHotelsData[k].name)) {
                            hMap = allHotelsData[k].mapUrl || ''; break;
                        }
                    }
                    if (!hMap) {
                        const FALLBACK_HOTEL_MAPS = {
                            '相鐵 FRESA INN': 'https://maps.app.goo.gl/x6TNUoGPjsmMHNgZ6', '富士暁月湖凪Konagi': 'https://maps.google.com/?q=富士暁月湖凪+Konagi',
                            '湯本富士屋酒店': 'https://maps.google.com/?q=湯本富士屋ホテル', '押上 Airbnb': 'https://maps.google.com/?q=押上'
                        };
                        hMap = FALLBACK_HOTEL_MAPS[hName] || '';
                    }
                }

                if (hName) {
                    
                    let mapBtn = hMap ? `<a href="${hMap}" target="_blank" class="map-btn" style="margin-top:8px;"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> 飯店地圖導航</a>` : '';

                    hotelCard.innerHTML = `

        function editItinerary(id) {
            let row = globalItinerary[id]; if(!row) return;
            document.getElementById('iti-id').value = id; document.getElementById('iti-title').value = row.title || '';
            document.getElementById('iti-date').value = row.date || currentDate; document.getElementById('iti-period').value = row.period || '上午';
            document.getElementById('iti-start').value = row.startTime || ''; document.getElementById('iti-end').value = row.endTime || '';
            document.getElementById('iti-map').value = row.mapUrl || ''; document.getElementById('iti-traffic').value = row.traffic || '';
            document.getElementById('iti-notes').value = row.notes || ''; 
            let linksList = row.customLinks || [];
            if (!row.customLinks && row.links) {
                let lines = row.links.split('\n').filter(l => l.trim());
                lines.forEach(line => {
                    let m = line.match(/(https?:\/\/[^\s]+)/);
                    if (m) {
                        let u = m[1];
                        let t = line.replace(u, '').replace(/[:：🔗]/g, '').trim();
                        linksList.push({ title: t || '官方連結', url: u });
                    }
                });
            }
            for (let i = 1; i <= 3; i++) {
                let item = linksList[i - 1] || {};
                document.getElementById(`iti-link-title-${i}`).value = item.title || '';
                document.getElementById(`iti-link-url-${i}`).value = item.url || '';
            }
            let savedTags = (row.tag || '').split(',').map(s=>s.trim());
            document.querySelectorAll('input[name="iti-tag"]').forEach(cb => { cb.checked = savedTags.includes(cb.value); });

            let data = {
                title: title, date: document.getElementById('iti-date').value, period: document.getElementById('iti-period').value,
                startTime: document.getElementById('iti-start').value, endTime: document.getElementById('iti-end').value,
                tag: tags.join(', '), mapUrl: document.getElementById('iti-map').value, traffic: document.getElementById('iti-traffic').value,
                notes: document.getElementById('iti-notes').value, pax: pax,
                customLinks: (() => {
                    let arr = [];
                    for (let i = 1; i <= 3; i++) {
                        let t = document.getElementById(`iti-link-title-${i}`).value.trim();

            if (id) { data.order = globalItinerary[id].order || 999; db.ref(`itinerary/${id}`).set(data); } 
            else { data.order = 999; db.ref('itinerary').push(data); }
            closeModal('itinerary-modal');

        function getAirlineName(flightNo) {
            if (!flightNo) return '';
            let fn = flightNo.toUpperCase().trim();
            if (fn.startsWith('IT')) return '台灣虎航 Tigerair';
            if (fn.startsWith('JX')) return '星宇航空 STARLUX';
            if (fn.startsWith('CI')) return '中華航空 China Airlines';
            if (fn.startsWith('BR')) return '長榮航空 EVA Air';
            if (fn.startsWith('GK')) return '捷星航空 Jetstar';
            if (fn.startsWith('UA')) return '聯合航空 United';
            return '待確認航空公司';
        }

            } else {

                let found = getAirlineName(fn);
                if (found) document.getElementById('editOutAirline').value = found;
            }

        function performMigrationFromCSV() {
            Papa.parse(CSV_URL + '&t=' + Date.now(), {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    let rows = results.data; let updates = {}; let order = 0; let headerIndex = -1;
                    for (let i = 0; i < Math.min(5, rows.length); i++) {
                        let vals = Object.values(rows[i]).map(v=>String(v).trim());
                        if(vals.includes('日期') || vals.includes('Date')) { headerIndex = i; break; }
                    }
                    let cleanRows = [];
                    if(headerIndex !== -1) {
                        let headers = rows[headerIndex];
                        for(let i = headerIndex+1; i < rows.length; i++) { let r = {}; for(let k in rows[i]) r[headers[k] || k] = rows[i][k]; cleanRows.push(r); }
                    } else { cleanRows = rows; }

                    cleanRows.forEach(row => {
                        let date = getVal(row, ['日期','Date']); let title = getVal(row, ['行程名稱','行程','Title']);
                        if(!date || !title) return;
                        
                        let paxStr = getVal(row, ['參與者','成員','Pax']);
                        let pax = paxStr ? paxStr.split(/[,、，]/).map(m=>m.trim().replace(/仁傑/g, '傑')).filter(m=>m) : [];
                        
                        let oldTag = getVal(row, ['tag','Tag']);
                        let newTags = [];
                        if(oldTag) {
                            if(oldTag.includes('吃') || oldTag.includes('餐')) newTags.push('🍣 吃的');
                            if(oldTag.includes('逛') || oldTag.includes('買')) newTags.push('🛍️ 逛的');
                            if(oldTag.includes('景點') || oldTag.includes('遊')) newTags.push('🗼 看的');
                            if(oldTag.includes('機') || oldTag.includes('車')) newTags.push('🚗 其他');
                        }

                        let newId = 'mig_' + Date.now() + '_' + order;
                        updates[newId] = {
                            date: date.split(' ')[0], title: title, period: getVal(row, ['時段','Period']),
                            startTime: getVal(row, ['開始時間','Start']), endTime: getVal(row, ['結束時間','End']),
                            tag: newTags.join(', '), notes: getVal(row, ['行程內容','行程細項與筆記','筆記']),
                            traffic: getVal(row, ['細項與筆記','交通路線','交通']), links: getVal(row, ['相關連結','連結']),
                            mapUrl: getVal(row, ['google map','地圖']), pax: pax, order: order++
                        };
                    });
                    db.ref('itinerary').set(updates).then(() => { db.ref('system/migrated').set(true); listenToItinerary(); });
                }
            });
        }
        function getVal(row, keys) {
            if (!row || typeof row !== 'object') return '';
            for (let k of keys) { if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') return String(row[k]).trim(); }
            for (let rk in row) {
                if (!rk) continue; let clean = String(rk).trim().replace(/^\ufeff/, '');
                for (let k of keys) { if (clean.toLowerCase() === String(k).toLowerCase()) { if (row[rk] !== undefined && row[rk] !== null && String(row[rk]).trim() !== '') return String(row[rk]).trim(); } }
            }
            return '';
        }

        function toggleItem(type, catId, itemId) {
            const data = type === 'shop' ? shoppingData : luggageData; const cat = data.find(c => c.id === catId);
            if(cat) { 
                const idx = cat.items.findIndex(i => i.id === itemId); 
                if(idx > -1) { 
                    const item = cat.items[idx]; 
                    item.checked = !item.checked; 
                    cat.items.splice(idx, 1);
                    if (item.checked) cat.items.push(item);
                    else cat.items.unshift(item);
                    saveList(type); 
                } 
            }
        }

                                </div>

                container.innerHTML += `<div style="margin-bottom:20px;">
                                            <div class="category-header" style="display:flex; justify-content:space-between; margin-bottom:8px;">

                                                </div>
                                            </div>
                                            <div class="sortable-${type}" data-catid="${cat.id}">
                                                ${itemsHtml}
                                            </div>
                                        </div>`;
            });
            
            // Initialize Sortable for items across categories
            setTimeout(() => {
                document.querySelectorAll(`.sortable-${type}`).forEach(el => {
                    new Sortable(el, {
                        group: type,
                        handle: '.list-drag-handle',
                        animation: 150,
                        delay: 100, delayOnTouchOnly: true,
                        onEnd: function (evt) {
                            let fromCatId = evt.from.dataset.catid;
                            let toCatId = evt.to.dataset.catid;
                            let oldIdx = evt.oldIndex;
                            let newIdx = evt.newIndex;
                            
                            const data = type === 'shop' ? shoppingData : luggageData;
                            let fromCat = data.find(c => c.id === fromCatId);
                            let toCat = data.find(c => c.id === toCatId);

                        }
                    });
                });
            }, 50);

                document.getElementById('todoTask').value = t.task || '';
                document.getElementById('todoDate').value = t.date || '';
                document.getElementById('todoTime').value = t.time || '';
                document.getElementById('todoNote').value = t.note || '';
            } else {
                document.getElementById('todoTask').value = ''; document.getElementById('todoDate').value = ''; document.getElementById('todoTime').value = ''; document.getElementById('todoNote').value = '';
            }
            document.getElementById('todoModal').style.display = 'flex';
            triggerAllAutoResize();
        }
        function saveTodo() {
            const task = document.getElementById('todoTask').value.trim(); if(!task) return;
            const id = document.getElementById('todoId').value;
            const data = { task: task, date: document.getElementById('todoDate').value, time: document.getElementById('todoTime').value, note: document.getElementById('todoNote').value.trim() };
            if (id) {
                db.ref(`users/${currentUserIdentity}/todo/${id}`).update(data);
            } else {
                data.checked = false;
                db.ref(`users/${currentUserIdentity}/todo`).push(data);
            }
            closeModal('todoModal');
        }
        function toggleTodo(id) { let t = todoData.find(x=>x.id===id); if(t) db.ref(`users/${currentUserIdentity}/todo/${id}/checked`).set(!t.checked); }
        function delTodo(id) { db.ref(`users/${currentUserIdentity}/todo/${id}`).remove(); }
        function renderTodoList() {
            const container = document.getElementById('todo-container'); container.innerHTML = '';
            if(todoData.length===0) return;
            
            // Sort by checked state, then by order
            todoData.sort((a,b) => {
                if (a.checked !== b.checked) return a.checked ? 1 : -1;
                return (a.order || 0) - (b.order || 0);
            });

            todoData.forEach(t => {
                let timeStr = t.time ? ` ${t.time}` : '';
                let d = (t.date || t.time) ? `<span style="font-size:10px; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px; display:inline-block; margin-top:2px;">⏳ ${t.date || ''}${timeStr}</span>` : '';
                let n = t.note ? `<div style="font-size:11px; color:#94A3B8; margin-top:4px; line-height:1.5;">${t.note.replace(/\n/g, '<br>')}</div>` : '';
                
                container.innerHTML += `<div class="item-card" data-id="${t.id}">
                    <div class="drag-handle list-drag-handle" style="width:20px; font-size:18px; padding:0; border:none; background:none; cursor:grab; color:rgba(255,255,255,0.15); display:flex; align-items:center; margin-right:4px;">⋮⋮</div>
                    <input type="checkbox" class="item-checkbox" ${t.checked?'checked':''} onchange="toggleTodo('${t.id}')">
                    <div style="flex:1">
                        <div class="item-title ${t.checked?'done':''}">${t.task}</div>
                        ${d}${n}
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="openTodoModal('${t.id}')" style="background:none; border:none; color:var(--accent-gold); cursor:pointer; font-size:16px;">✏️</button>
                        <button onclick="delTodo('${t.id}')" style="background:none; border:none; color:#64748B; cursor:pointer; font-size:16px;">✕</button>
                    </div>
                </div>`;
            });
            
            setTimeout(() => {
                if (window.todoSortableInstance) window.todoSortableInstance.destroy();
                window.todoSortableInstance = new Sortable(container, {
                    handle: '.list-drag-handle',
                    animation: 150,
                    delay: 100, delayOnTouchOnly: true,
                    onEnd: function () {
                        let items = container.querySelectorAll('.item-card');
                        let updates = {};
                        items.forEach((item, index) => { 
                            let tId = item.dataset.id;
                            updates[`users/${currentUserIdentity}/todo/${tId}/order`] = index; 
                        });
                        db.ref().update(updates);
                    }
                });
            }, 50);
        }
    </script>
</body>
</html>
